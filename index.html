<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="bootstrap.min.css" />
    <title>Document</title>
  </head>
  <body>
    <div
      style="background-color: antiquewhite"
      class="vh-100 w-100 d-flex flex-column justify-content-center gap-5"
    >
      <div class="plus w-100 d-flex justify-content-center gap-5">
        <button
          id="plusbtn"
          onclick="increment()"
          class="btn btn-primary btn-md"
        >
          +
        </button>
        <button id="minbtn" onclick="decrement()" class="btn btn-danger btn-md">
          -
        </button>
      </div>
      <div class="w-100 d-flex justify-content-center">
        <h1 id="result">0</h1>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
